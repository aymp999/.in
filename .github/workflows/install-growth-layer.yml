name: Install AYMP Growth Layer (Audit Only)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install-growth-layer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit homepage growth layers without publishing changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          markers = [
            'AYMP-GROWTH-LAYER',
            'AYMP-DAILY-DISCOVERY-IMAGES',
            'AYMP-LIVE-GLOBAL-UPGRADE',
            'AYMP-GAME-ZONE-ENTRY',
            'AYMP-DISCOVERY-WORLD',
            'AYMP-TOKEN-ECONOMY',
            'AYMP-AUTO-GLOBAL-SHARING',
            'AYMP-COSMIC-OPENING',
          ]
          missing = [m for m in markers if ('<!-- ' + m + ' -->') not in text]
          if missing:
              print('Homepage audit: missing managed layer markers: ' + ', '.join(missing))
          else:
              print('Homepage audit: all managed growth layer markers are present.')
          print('AUDIT ONLY: this workflow never writes or pushes index.html.')
          PY
