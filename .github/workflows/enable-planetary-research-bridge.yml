name: Enable AYMP Planetary Research Bridge (Parked)

# PARKED LEGACY WORKFLOW — preserved for future use.
# This workflow previously auto-ran on pushes and produced failed runs.
# It is now manual-only so it cannot create noise or modify the guidance engine automatically.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add planetary database bridge to guidance engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/guidance.js')
          text = path.read_text(encoding='utf-8')
          marker = 'AYMP_PLANETARY_RESEARCH_BRIDGE_V1'

          if marker not in text:
              addition = r'''

// AYMP_PLANETARY_RESEARCH_BRIDGE_V1
(function loadPlanetaryResearchBridge(){
  function addBridge(){
    if(document.getElementById('aympPlanetaryResearchDbLoader')) return;
    const script=document.createElement('script');
    script.id='aympPlanetaryResearchDbLoader';
    script.src='assets/js/planetary-research-db.js';
    script.defer=true;
    document.body.appendChild(script);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addBridge);
  else addBridge();
})();
'''
              text += addition

          marker2 = 'AYMP_LAGNA_RESEARCH_RESULT_ENGINE_V1'
          if marker2 not in text:
              text += r'''

// AYMP_LAGNA_RESEARCH_RESULT_ENGINE_V1
(function loadLagnaResearchResultEngine(){
  function addEngine(){
    if(document.getElementById('aympLagnaResearchResultLoader')) return;
    const script=document.createElement('script');
    script.id='aympLagnaResearchResultLoader';
    script.src='assets/js/aymp-lagna-research-result.js';
    script.defer=true;
    document.body.appendChild(script);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addEngine);
  else addEngine();
})();
'''

          marker3 = 'AYMP_LAGNA_LIFE_CONCERN_MAPPING_ENGINE_V1'
          if marker3 not in text:
              text += r'''

// AYMP_LAGNA_LIFE_CONCERN_MAPPING_ENGINE_V1
(function loadLagnaLifeConcernMappingEngine(){
  function addMapping(){
    if(document.getElementById('aympLagnaLifeConcernMappingLoader')) return;
    const script=document.createElement('script');
    script.id='aympLagnaLifeConcernMappingLoader';
    script.src='assets/js/aymp-lagna-life-concern-mapping.js';
    script.defer=true;
    document.body.appendChild(script);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addMapping);
  else addMapping();
})();
'''

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit bridge activation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/guidance.js
          if git diff --cached --quiet; then
            echo 'Bridge already active.'
          else
            git commit -m 'Load Lagna life concern mapping engine'
            git push
          fi
