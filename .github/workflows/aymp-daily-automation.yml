name: AYMP Daily Automation

on:
  workflow_dispatch:
  schedule:
    # 07:00 Asia/Kolkata (01:30 UTC) every day
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: aymp-daily-automation
  cancel-in-progress: false

jobs:
  daily-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run AYMP daily engine
        run: python3 automation/aymp_daily_engine.py

      - name: Commit daily state only
        shell: bash
        run: |
          if git diff --quiet -- data/aymp-daily-state.json automation/AYMP-AUTO-STATUS.md; then
            echo "No daily state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"
          git add data/aymp-daily-state.json automation/AYMP-AUTO-STATUS.md
          git commit -m "Update AYMP daily automation state"
          git push origin HEAD:main
